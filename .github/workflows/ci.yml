name: Pilot unit and distribution tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test local runtime, monitor and package (offline)
        run: python -m unittest discover -s tests -v
      - name: Validate distribution scaffold
        run: python scripts/validate_distribution.py
      - name: Parse-check the host smoke script (does not run any agent)
        shell: pwsh
        run: '$null = [scriptblock]::Create((Get-Content scripts/host_smoke.ps1 -Raw)); "host_smoke.ps1 parses"'
